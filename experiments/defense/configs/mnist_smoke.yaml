# Fast smoke test (tiny train + short recon). Not for reporting.
dataset: MNIST
k_clients: 2
seed: 0
data:
  data_dir: ./data
train:
  epochs: 2
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0
  optimizer: adam
  device: cpu
swap:
  strategies:
    - optimal_topk
  attacker_client_idx: 0
  attacker_probe: false
  topk: 3
  core_q: 0.55
  cluster_dir: ./clusters
  protect_test: true
  use_signature_cache: false
use_split_lenet: false

defense:
  run_naked_poisoned: true
  rgar_full: true
  rgar_downweight: false
  rgar:
    recon_epochs: 1
    ref_warmup_epochs: 1
