# Smoke: .venv/bin/python scripts/run_attack_defense.py --config experiments/defense/configs/ucihar_smoke.yaml --strategy optimal_topk
dataset: UCI-HAR
k_clients: 2
seed: 42
data:
  data_dir: ./data
  tabular_train_fraction: 0.85
train:
  epochs: 5
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0
  device: cpu
  optimizer: adam
stealth_oracle_labels: true
har_attack_split: mi_ranked
har_attack_share: 0.88
har_attack_model: asymmetric
har_aux_labeled_frac: 0.03
swap:
  strategies:
    - optimal_topk
  attacker_client_idx: 0
  attacker_probe: false
  topk: 6
  core_q: 0.45
  cluster_dir: ./clusters
  protect_test: true
  use_signature_cache: false
  ignore_cluster_conf: true
defense:
  run_naked_poisoned: true
  rgar_full: true
  rgar_downweight: false
  use_rgar_tabular_defaults: true
  rgar:
    recon_epochs: 10
    ref_frac: 0.10
    ref_warmup_epochs: 2
