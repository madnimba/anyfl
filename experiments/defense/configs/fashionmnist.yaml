# Fashion-MNIST: cluster-swap + RGAR (same stack as MNIST).
# Phase I: ./clusters/FASHIONMNIST_ids.npy
# Runner: python3 scripts/run_attack_defense.py --config experiments/defense/configs/fashionmnist.yaml
dataset: Fashion-MNIST
k_clients: 2
seed: 0
data:
  data_dir: ./data
  train_samples: null
  test_samples: null
  tabular_train_fraction: 0.85
train:
  epochs: 80
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0
  optimizer: adam
  # Device is declared explicitly on every config in this repo. Implicit
  # defaults resolve to whatever hardware happens to be visible, which is how
  # the archived runs and the configs drifted apart. Value below = the device
  # that produced this dataset's number in the submitted paper.
  device: cuda
swap:
  strategies:
    - optimal_topk
    - derangement
    - paired_clusters
    - round_robin
    - random_clusters
    - random_per_sample
  # Pinned, not probed. The probe ranks clients using the *trained* clean model,
  # so its choice moves with train_seed: MNIST seed 5 attacked client 1 instead of
  # client 0 and scored 53.3% against ~31% for the other seeds, inflating the mean
  # to 36.38 +/- 9.70. Every archived run used client 0.
  attacker_client_idx: 0
  attacker_probe: false
  topk: 5
  core_q: 0.55
  cluster_dir: ./clusters
  protect_test: true
  use_signature_cache: false
stealth_oracle_labels: true
use_split_lenet: false

defense:
  run_naked_poisoned: true
  rgar_full: true
  rgar_downweight: false
  rgar:
    recon_epochs: 120
