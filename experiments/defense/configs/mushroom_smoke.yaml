# Smoke: .venv/bin/python scripts/run_attack_defense.py --config experiments/defense/configs/mushroom_smoke.yaml --strategy optimal_topk
dataset: UCI-MUSHROOM
k_clients: 2
seed: 0
data:
  data_dir: ./data
  tabular_train_fraction: 0.85
train:
  epochs: 5
  batch_size: 512
  lr: 0.001
  weight_decay: 0.0
swap:
  strategies:
    - optimal_topk
  attacker_client_idx: 0
  attacker_probe: false
  topk: 3
  core_q: 0.52
  cluster_dir: ./clusters
  protect_test: true
  use_signature_cache: false
  ignore_cluster_conf: true
defense:
  run_naked_poisoned: true
  rgar_full: true
  rgar_downweight: false
  rgar:
    recon_epochs: 24
    ref_frac: 0.10
    ref_warmup_epochs: 2
