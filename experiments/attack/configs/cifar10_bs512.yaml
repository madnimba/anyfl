# CIFAR-10 K=2, batch 512.
#
# Identical to ``cifar10.yaml`` except batch_size: 1024 -> 512. The submitted
# CIFAR-10 numbers came from a card with more VRAM than the A5500's 24 GB, so
# the original batch size does not fit. Kept as a separate config rather than a
# CLI override so the change is visible in the run's archived config.yaml and in
# every results row.
dataset: CIFAR-10
k_clients: 2
seed: 0
data:
  data_dir: ./data
train:
  epochs: 80
  batch_size: 512
  lr: 0.001
  weight_decay: 0.01
  optimizer: adamw
  augment_cifar10: true
  # Device is declared explicitly on every config in this repo. Implicit
  # defaults resolve to whatever hardware happens to be visible, which is how
  # the archived runs and the configs drifted apart. Value below = the device
  # that produced this dataset's number in the submitted paper.
  device: cuda
swap:
  strategies:
    - optimal_topk
  attacker_client_idx: 0
  attacker_probe: true
  topk: 3
  core_q: 0.6
  cluster_dir: ./clusters
  protect_test: true
  use_signature_cache: false
  ignore_cluster_conf: true
  use_clean_encoder_geometry: true
  save_attacker_embeddings: true
